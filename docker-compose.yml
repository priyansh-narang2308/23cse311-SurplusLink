services:
  backend:
    build:
      context: ../Backend
      dockerfile: Dockerfile
    container_name: surpluslink-backend
    ports:
      - "8000:8000"
    env_file:
      - ../Backend/.env
    volumes:
      - ../Backend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
    networks:
      - surpluslink-network

  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
    container_name: surpluslink-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - surpluslink-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: surpluslink-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - surpluslink-network
    restart: unless-stopped

networks:
  surpluslink-network:
    driver: bridge
